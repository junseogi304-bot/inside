<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인사이드 톡 - 실시간 커뮤니티 포털</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="goHome()" class="flex items-center space-x-2 text-left group">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-blue-100 group-hover:bg-blue-700 transition">💬</div>
                <div>
                    <h1 class="font-black text-slate-900 text-lg leading-none tracking-tight">인사이드 톡</h1>
                    <span class="text-[11px] text-blue-600 font-semibold">실시간 클라우드 커뮤니티</span>
                </div>
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <div id="connection-status" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-600 border border-amber-200">
                <span class="w-1.5 h-1.5 mr-1.5 bg-amber-500 rounded-full animate-pulse"></span> 연결 중...
            </div>
            <div id="nickname-badge" class="bg-slate-100 text-slate-700 font-bold text-xs px-3 py-1.5 rounded-xl border border-slate-200 truncate max-w-[120px]">
                익명
            </div>
            <button onclick="shareLink()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                <span class="hidden sm:inline">링크 복사</span>
            </button>
        </div>
    </header>

    <!-- Main View Area -->
    <main class="flex-grow overflow-y-auto max-w-5xl w-full mx-auto p-4 flex flex-col">
        
        <!-- VIEW 1: HOME / GALLERY LIST -->
        <div id="view-home" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <div class="relative z-10 space-y-2">
                    <span class="bg-white/20 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider">LIVE CLOUD</span>
                    <h2 class="text-xl font-bold">링크만 공유하면 누구나 실시간 대화 가능!</h2>
                    <p class="text-xs text-blue-100 leading-relaxed max-w-xl">원하는 갤러리(방)에 입장하여 실시간으로 올라오는 다른 사람들의 글과 댓글을 확인하고 소통해 보세요.</p>
                </div>
                <div class="absolute -right-4 -bottom-6 text-7xl opacity-20 font-black">⚡</div>
            </div>

            <div>
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-slate-800 text-base flex items-center space-x-1.5">
                        <span>📂</span><span>실시간 갤러리 목록</span>
                    </h3>
                    <span class="text-xs text-slate-400">클릭해서 실시간 방으로 입장하세요</span>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4" id="gallery-grid"></div>
            </div>
        </div>

        <!-- VIEW 2: BOARD / ROOM VIEW -->
        <div id="view-room" class="hidden flex-col flex-grow space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3">
                    <button onclick="goHome()" class="w-9 h-9 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition font-bold">←</button>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="current-room-icon" class="text-lg"></span>
                            <h2 id="current-room-title" class="font-bold text-slate-900 text-base"></h2>
                        </div>
                        <p id="current-room-desc" class="text-xs text-slate-400"></p>
                    </div>
                </div>
                <button onclick="openWriteModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-sm transition flex items-center space-x-1">
                    <span>✏️</span><span>글쓰기</span>
                </button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-grow overflow-hidden flex flex-col">
                <div class="p-3 bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 flex justify-between">
                    <span>실시간 제목 및 내용</span>
                    <span>작성자 / 시간</span>
                </div>
                <div id="posts-container" class="divide-y divide-slate-100 overflow-y-auto flex-grow"></div>
            </div>
        </div>

        <!-- VIEW 3: POST DETAIL & COMMENTS VIEW -->
        <div id="view-post" class="hidden flex-col flex-grow space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between shrink-0">
                <button onclick="backToRoom()" class="flex items-center space-x-1.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition">
                    <span>←</span><span>목록으로</span>
                </button>
                <span id="detail-room-badge" class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-lg"></span>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                <div class="border-b border-slate-100 pb-4">
                    <h2 id="detail-title" class="text-lg font-bold text-slate-900 mb-2"></h2>
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span id="detail-author" class="font-semibold text-slate-600"></span>
                        <span id="detail-time"></span>
                    </div>
                </div>
                <div id="detail-content" class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed min-h-[100px]"></div>
            </div>

            <!-- Comments Section -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-1">
                    <span>💬</span><span>실시간 댓글 <span id="comment-count" class="text-blue-600">0</span></span>
                </h3>

                <div id="comments-list" class="space-y-3 max-h-60 overflow-y-auto pr-1"></div>

                <form onsubmit="submitComment(event)" class="flex space-x-2 pt-2 border-t border-slate-100">
                    <input 
                        type="text" 
                        id="comment-input" 
                        placeholder="실시간 댓글을 남겨보세요..." 
                        autocomplete="off"
                        required
                        class="flex-grow bg-slate-50 border border-slate-200 text-xs rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:bg-white transition"
                    >
                    <button type="submit" class="bg-slate-900 hover:bg-blue-600 text-white font-medium px-4 py-2.5 rounded-xl text-xs transition shrink-0">
                        등록
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Write Post Modal -->
    <div id="write-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold text-slate-900">새 글 작성하기</h3>
                <button onclick="closeWriteModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
            </div>
            
            <form onsubmit="submitPost(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">제목</label>
                    <input type="text" id="post-title-input" required placeholder="제목을 입력하세요" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">내용</label>
                    <textarea id="post-content-input" rows="5" required placeholder="자유롭게 이야기를 남겨주세요..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeWriteModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">취소</button>
                    <button type="submit" class="px-5 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Imports & Realtime Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db, auth;
        let currentRoomId = null;
        let currentPostId = null;
        let postsUnsubscribe = null;
        let commentsUnsubscribe = null;

        // 사용자가 제공한 실제 파이어베이스 설정 및 프로젝트 ID 적용
        const appId = 'insideonside-community';
        const firebaseConfig = {
            apiKey: "AIzaSyAYYX1ONHIIKvp35VOn-emjQRSk2WYoirM",
            authDomain: "insideonside.firebaseapp.com",
            projectId: "insideonside",
            storageBucket: "insideonside.firebasestorage.app",
            messagingSenderId: "821707087552",
            appId: "1:821707087552:web:0850d20fee543ac94ad725",
            measurementId: "G-675070ZSZL"
        };

        const galleries = [
            { id: 'romance', title: '연애고민 갤러리', desc: '썸, 짝사랑, 연애 썰과 고민', icon: '💌', color: 'bg-pink-50 text-pink-600 border-pink-100 hover:border-pink-300' },
            { id: 'life', title: '인생고민 갤러리', desc: '진로, 취업, 인간관계 상담', icon: '🌱', color: 'bg-emerald-50 text-emerald-600 border-emerald-100 hover:border-emerald-300' },
            { id: 'humor', title: '유머/썰 갤러리', desc: '웃긴 이야기, 일상 에피소드', icon: '😂', color: 'bg-amber-50 text-amber-600 border-amber-100 hover:border-amber-300' },
            { id: 'tech', title: '디지털/IT 갤러리', desc: '전자기기, 앱, 테크 정보', icon: '💻', color: 'bg-blue-50 text-blue-600 border-blue-100 hover:border-blue-300' }
        ];

        function generateNickname() {
            const animals = ["다람쥐", "토끼", "쿼카", "판다", "펭귄", "햄스터", "너구리", "여우", "백구", "기린"];
            const adjectives = ["졸린", "행복한", "배고픈", "신난", "멍때리는", "노래하는", "춤추는", "고민하는"];
            return `${adjectives[Math.floor(Math.random() * adjectives.length)]} ${animals[Math.floor(Math.random() * animals.length)]} #${Math.floor(Math.random() * 900) + 100}`;
        }

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                await signInAnonymously(auth);

                const statusEl = document.getElementById('connection-status');
                statusEl.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-600 border border-emerald-200";
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full"></span> 톡 활성화됨';
            } catch (err) {
                console.error("Firebase connection error:", err);
                const statusEl = document.getElementById('connection-status');
                statusEl.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-600 border border-rose-200";
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 bg-rose-500 rounded-full"></span> 연결 오류';
            }
        }

        function initApp() {
            let myNickname = localStorage.getItem('dc_nickname');
            if (!myNickname) {
                myNickname = generateNickname();
                localStorage.setItem('dc_nickname', myNickname);
            }
            document.getElementById('nickname-badge').innerText = myNickname;
            renderGalleries();
            initFirebase();
        }

        function renderGalleries() {
            const grid = document.getElementById('gallery-grid');
            if (!grid) return;
            grid.innerHTML = galleries.map(g => `
                <button onclick="window.enterGallery('${g.id}')" class="p-5 rounded-2xl border-2 ${g.color} transition flex flex-col items-start text-left space-y-3 shadow-sm group">
                    <span class="text-3xl bg-white p-2.5 rounded-xl shadow-xs">${g.icon}</span>
                    <div>
                        <h4 class="font-bold text-slate-900 text-sm group-hover:text-blue-600">${g.title}</h4>
                        <p class="text-[11px] text-slate-500 mt-0.5">${g.desc}</p>
                    </div>
                </button>
            `).join('');
        }

        window.enterGallery = function(roomId) {
            currentRoomId = roomId;
            const info = galleries.find(g => g.id === roomId);

            document.getElementById('current-room-icon').innerText = info.icon;
            document.getElementById('current-room-title').innerText = info.title;
            document.getElementById('current-room-desc').innerText = info.desc;

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-post').classList.add('hidden');
            document.getElementById('view-room').classList.remove('hidden');
            document.getElementById('view-room').classList.add('flex');

            listenPosts(roomId);
        }

        window.goHome = function() {
            if (postsUnsubscribe) postsUnsubscribe();
            if (commentsUnsubscribe) commentsUnsubscribe();
            document.getElementById('view-room').classList.remove('flex');
            document.getElementById('view-room').classList.add('hidden');
            document.getElementById('view-post').classList.remove('flex');
            document.getElementById('view-post').classList.add('hidden');
            document.getElementById('view-home').classList.remove('hidden');
        }

        window.backToRoom = function() {
            if (commentsUnsubscribe) commentsUnsubscribe();
            document.getElementById('view-post').classList.remove('flex');
            document.getElementById('view-post').classList.add('hidden');
            document.getElementById('view-room').classList.remove('hidden');
            document.getElementById('view-room').classList.add('flex');
        }

        function listenPosts(roomId) {
            const container = document.getElementById('posts-container');
            container.innerHTML = `<div class="p-12 text-center text-xs text-slate-400">실시간 게시글 불러오는 중...</div>`;

            if (postsUnsubscribe) postsUnsubscribe();

            const postsCol = collection(db, 'artifacts', appId, 'public', 'data', `room_${roomId}_posts`);
            
            postsUnsubscribe = onSnapshot(postsCol, (snapshot) => {
                const posts = [];
                snapshot.forEach(docSnap => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (posts.length === 0) {
                    container.innerHTML = `<div class="p-12 text-center text-xs text-slate-400">작성된 게시글이 없습니다. 우측 상단 '글쓰기' 버튼을 눌러 첫 글을 작성해 보세요!</div>`;
                    return;
                }

                container.innerHTML = posts.map(p => `
                    <div onclick="window.openPost('${p.id}', '${escapeAttr(p.title)}', '${escapeAttr(p.content)}', '${escapeAttr(p.nickname)}', '${p.createdAt || Date.now()}')" class="p-4 hover:bg-slate-50 cursor-pointer transition flex items-center justify-between border-b border-slate-50">
                        <div class="space-y-1 pr-4">
                            <h4 class="font-bold text-slate-800 text-sm hover:text-blue-600">${escapeHtml(p.title)}</h4>
                            <p class="text-xs text-slate-500 line-clamp-1">${escapeHtml(p.content)}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-xs font-medium text-slate-700">${escapeHtml(p.nickname)}</div>
                            <div class="text-[10px] text-slate-400 mt-0.5">${formatTime(p.createdAt)}</div>
                        </div>
                    </div>
                `).join('');
            }, (error) => {
                console.error("Posts subscription error:", error);
                container.innerHTML = `<div class="p-12 text-center text-xs text-rose-500">데이터를 불러오는 중 오류가 발생했습니다. Firestore 규칙을 확인해주세요.</div>`;
            });
        }

        window.openPost = function(postId, title, content, nickname, createdAt) {
            currentPostId = postId;
            document.getElementById('detail-room-badge').innerText = galleries.find(g => g.id === currentRoomId).title;
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-author').innerText = `작성자: ${nickname}`;
            document.getElementById('detail-time').innerText = formatTime(createdAt);
            document.getElementById('detail-content').innerText = content;

            document.getElementById('view-room').classList.remove('flex');
            document.getElementById('view-room').classList.add('hidden');
            document.getElementById('view-post').classList.remove('hidden');
            document.getElementById('view-post').classList.add('flex');

            listenComments(postId);
        }

        function listenComments(postId) {
            const container = document.getElementById('comments-list');
            container.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">댓글 불러오는 중...</div>`;

            if (commentsUnsubscribe) commentsUnsubscribe();

            const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', `post_${postId}_comments`);

            commentsUnsubscribe = onSnapshot(commentsCol, (snapshot) => {
                const comments = [];
                snapshot.forEach(docSnap => {
                    comments.push({ id: docSnap.id, ...docSnap.data() });
                });
                comments.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

                document.getElementById('comment-count').innerText = comments.length;

                if (comments.length === 0) {
                    container.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">첫 번째 실시간 댓글을 남겨보세요!</div>`;
                    return;
                }

                container.innerHTML = comments.map(c => `
                    <div class="bg-slate-50 rounded-xl p-3 text-xs space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-700">${escapeHtml(c.nickname)}</span>
                            <span class="text-[10px] text-slate-400">${formatTime(c.createdAt)}</span>
                        </div>
                        <p class="text-slate-600 leading-relaxed">${escapeHtml(c.text)}</p>
                    </div>
                `).join('');
            }, (error) => {
                console.error("Comments error:", error);
                container.innerHTML = `<div class="text-center text-xs text-rose-500 py-4">댓글 로드 중 오류 발생</div>`;
            });
        }

        window.submitComment = async function(event) {
            event.preventDefault();
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text || !currentPostId) return;

            const myNickname = localStorage.getItem('dc_nickname') || '익명';
            input.value = '';

            try {
                const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', `post_${currentPostId}_comments`);
                await addDoc(commentsCol, {
                    text: text,
                    nickname: myNickname,
                    createdAt: Date.now()
                });
            } catch (err) {
                console.error("Failed to add comment:", err);
            }
        }

        window.openWriteModal = function() {
            document.getElementById('write-modal').classList.remove('hidden');
            document.getElementById('write-modal').classList.add('flex');
        }

        window.closeWriteModal = function() {
            document.getElementById('write-modal').classList.remove('flex');
            document.getElementById('write-modal').classList.add('hidden');
            document.getElementById('post-title-input').value = '';
            document.getElementById('post-content-input').value = '';
        }

        window.submitPost = async function(event) {
            event.preventDefault();
            const title = document.getElementById('post-title-input').value.trim();
            const content = document.getElementById('post-content-input').value.trim();
            if (!title || !content || !currentRoomId) return;

            const myNickname = localStorage.getItem('dc_nickname') || '익명';
            closeWriteModal();

            try {
                const postsCol = collection(db, 'artifacts', appId, 'public', 'data', `room_${currentRoomId}_posts`);
                await addDoc(postsCol, {
                    title: title,
                    content: content,
                    nickname: myNickname,
                    createdAt: Date.now()
                });
            } catch (err) {
                console.error("Failed to submit post:", err);
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function escapeAttr(str) {
            return String(str || '').replace(/'/g, "&#39;").replace(/"/g, "&quot;");
        }

        function formatTime(timestamp) {
            if (!timestamp) return '방금 전';
            const date = new Date(Number(timestamp));
            const now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return '방금 전';
            if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        window.shareLink = function() {
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            document.execCommand('copy');
            document.body.removeChild(dummy);
            
            const toast = document.createElement('div');
            toast.className = "fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-lg z-50 animate-bounce";
            toast.innerText = "클립보드에 링크가 복사되었습니다! 친구에게 공유해보세요.";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        window.onload = initApp;
    </script>
</body>
</html>
