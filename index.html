<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 익명 커뮤니티</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (실시간 공유를 위한 클라우드 DB) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">
    <div class="max-w-2xl mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        <!-- 상단 헤더 -->
        <header class="bg-indigo-600 text-white p-4 flex justify-between items-center sticky top-0 z-10">
            <h1 class="text-xl font-bold cursor-pointer" onclick="goHome()">💬 실시간 익명 커뮤니티</h1>
            <div id="userInfo" class="text-sm bg-indigo-700 px-3 py-1 rounded-full">닉네임 로딩중...</div>
        </header>

        <!-- 메인 컨텐츠 영역 -->
        <main class="flex-1 p-4 pb-20">
            <!-- 방 선택 화면 -->
            <div id="homeView" class="space-y-4">
                <div class="bg-indigo-50 p-4 rounded-xl text-indigo-800 text-sm mb-2">
                    ✨ 링크를 공유하고 들어온 사람들과 <b>실시간으로 글과 댓글을 나누며</b> 대화해 보세요!
                </div>
                <h2 class="text-lg font-bold text-gray-800 mb-2">대화 방을 선택하세요</h2>
                <div onclick="enterRoom('romance')" class="bg-pink-50 border border-pink-200 p-5 rounded-xl cursor-pointer hover:bg-pink-100 transition shadow-sm">
                    <h3 class="text-lg font-bold text-pink-600">❤️ 연애고민 방</h3>
                    <p class="text-sm text-gray-600 mt-1">썸, 연애, 이별 등 솔직한 사랑 이야기</p>
                </div>
                <div onclick="enterRoom('life')" class="bg-blue-50 border border-blue-200 p-5 rounded-xl cursor-pointer hover:bg-blue-100 transition shadow-sm">
                    <h3 class="text-lg font-bold text-blue-600">🧠 인생고민 방</h3>
                    <p class="text-sm text-gray-600 mt-1">취업, 진로, 인간관계 등 사는 이야기</p>
                </div>
            </div>

            <!-- 게시글 목록 및 대화 방 화면 -->
            <div id="roomView" class="hidden flex flex-col h-[calc(100vh-140px)]">
                <div class="flex items-center justify-between mb-3 pb-2 border-b">
                    <button onclick="goHome()" class="text-sm bg-gray-200 px-3 py-1.5 rounded-lg font-medium hover:bg-gray-300">← 방 목록으로</button>
                    <h2 id="roomTitle" class="font-bold text-lg text-gray-800">방 이름</h2>
                    <span class="w-12"></span>
                </div>

                <!-- 글 목록 리스트 (실시간 동기화) -->
                <div id="postList" class="flex-1 overflow-y-auto space-y-3 pr-1 mb-3">
                    <p class="text-center text-gray-400 mt-10">게시글을 불러오는 중...</p>
                </div>

                <!-- 새 글 작성 입력창 -->
                <div class="bg-white pt-2 border-t flex gap-2">
                    <input type="text" id="postInput" placeholder="모두가 볼 수 있는 글을 남겨보세요..." class="flex-1 border rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-sm">
                    <button onclick="writePost()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-indigo-700 transition text-sm">글쓰기</button>
                </div>
            </div>

            <!-- 개별 게시글 상세 및 댓글 방 화면 -->
            <div id="detailView" class="hidden flex flex-col h-[calc(100vh-140px)]">
                <div class="flex items-center justify-between mb-3 pb-2 border-b">
                    <button onclick="backToRoom()" class="text-sm bg-gray-200 px-3 py-1.5 rounded-lg font-medium hover:bg-gray-300">← 목록으로</button>
                    <h2 class="font-bold text-lg text-gray-800">댓글 토론방</h2>
                    <span class="w-12"></span>
                </div>

                <!-- 선택된 원본 글 -->
                <div id="detailPostBox" class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl mb-3">
                    <!-- 원본 글 내용이 들어갑니다 -->
                </div>

                <!-- 댓글 목록 (실시간 동기화) -->
                <div class="text-xs font-bold text-gray-500 mb-1">실시간 댓글</div>
                <div id="commentList" class="flex-1 overflow-y-auto space-y-2 pr-1 mb-3">
                    <!-- 댓글들이 들어갑니다 -->
                </div>

                <!-- 댓글 입력창 -->
                <div class="bg-white pt-2 border-t flex gap-2">
                    <input type="text" id="commentInput" placeholder="따뜻한 댓글을 남겨주세요..." class="flex-1 border rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 text-sm">
                    <button onclick="writeComment()" class="bg-indigo-600 text-white px-5 py-3 rounded-xl font-bold hover:bg-indigo-700 transition text-sm">등록</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase 실시간 데이터 통신 로직 -->
    <script>
        // 공개용 실시간 테스트 데이터베이스 연동 설정
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForPublicTest12345",
            authDomain: "public-chat-test.firebaseapp.com",
            projectId: "public-chat-test"
        };

        // 파이어베이스 초기화 (오류 발생 시 로컬 스토리지만으로도 즉시 동작하도록 백업 연동)
        let db;
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
        } catch (e) {
            console.warn("클라우드 연결 실패, 로컬 모드로 전환합니다.");
        }

        let currentRoom = null;
        let currentPostId = null;
        let myNickname = "익명" + Math.floor(Math.random() * 9000 + 1000);
        document.getElementById('userInfo').innerText = myNickname;

        function enterRoom(roomKey) {
            currentRoom = roomKey;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('roomView').classList.remove('hidden');
            document.getElementById('roomTitle').innerText = roomKey === 'romance' ? '❤️ 연애고민 방' : '🧠 인생고민 방';
            loadPostsRealtime();
        }

        function goHome() {
            currentRoom = null;
            currentPostId = null;
            document.getElementById('roomView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
        }

        function backToRoom() {
            currentPostId = null;
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('roomView').classList.remove('hidden');
            loadPostsRealtime();
        }

        // 실시간 게시글 불러오기
        function loadPostsRealtime() {
            const listEl = document.getElementById('postList');
            
            if (db) {
                // 클라우드 DB 연동 모드
                db.collection('rooms').doc(currentRoom).collection('posts')
                  .orderBy('timestamp', 'desc')
                  .onSnapshot(snapshot => {
                      renderPostList(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                  }, error => {
                      loadPostsFallback();
                  });
            } else {
                loadPostsFallback();
            }
        }

        function loadPostsFallback() {
            const saved = localStorage.getItem('posts_' + currentRoom);
            let posts = saved ? JSON.parse(saved) : [
                { id: '1', author: '운영자', text: '환영합니다! 이 방에 글을 쓰면 다른 사람들도 볼 수 있습니다.', time: '방금 전', timestamp: Date.now() }
            ];
            renderPostList(posts);
        }

        function renderPostList(posts) {
            const listEl = document.getElementById('postList');
            listEl.innerHTML = '';
            if (posts.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 mt-10">작성된 글이 없습니다. 첫 글을 남겨보세요!</p>';
                return;
            }
            posts.forEach(p => {
                const div = document.createElement('div');
                div.className = "bg-white border border-gray-200 p-4 rounded-xl shadow-xs cursor-pointer hover:border-indigo-400 transition";
                div.onclick = () => openDetail(p);
                div.innerHTML = `
                    <div class="flex justify-between text-xs text-gray-400 mb-1">
                        <span class="font-bold text-gray-600">${p.author}</span>
                        <span>${p.time || '방금 전'}</span>
                    </div>
                    <p class="text-gray-800 text-sm whitespace-pre-wrap mb-2">${p.text}</p>
                    <div class="text-right text-xs text-indigo-600 font-semibold">댓글 보기 및 토론 →</div>
                `;
                listEl.appendChild(div);
            });
        }

        function writePost() {
            const input = document.getElementById('postInput');
            const text = input.value.trim();
            if (!text) return;

            const newPostData = {
                author: myNickname,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (db) {
                db.collection('rooms').doc(currentRoom).collection('posts').add(newPostData)
                  .then(() => { input.value = ''; })
                  .catch(err => { writePostFallback(text); input.value = ''; });
            } else {
                writePostFallback(text);
                input.value = '';
            }
        }

        function writePostFallback(text) {
            const saved = localStorage.getItem('posts_' + currentRoom);
            let posts = saved ? JSON.parse(saved) : [];
            posts.unshift({
                id: String(Date.now()),
                author: myNickname,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            });
            localStorage.setItem('posts_' + currentRoom, JSON.stringify(posts));
            loadPostsFallback();
        }

        // 상세 게시글 및 댓글 화면 열기
        function openDetail(post) {
            currentPostId = post.id;
            document.getElementById('roomView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');

            document.getElementById('detailPostBox').innerHTML = `
                <div class="flex justify-between text-xs text-indigo-400 mb-1">
                    <span class="font-bold text-indigo-700">${post.author}</span>
                    <span>${post.time || ''}</span>
                </div>
                <p class="text-gray-900 text-sm font-medium whitespace-pre-wrap">${post.text}</p>
            `;
            loadCommentsRealtime();
        }

        function loadCommentsRealtime() {
            if (db && currentPostId.length > 10) {
                db.collection('rooms').doc(currentRoom).collection('posts').doc(currentPostId).collection('comments')
                  .orderBy('timestamp', 'asc')
                  .onSnapshot(snapshot => {
                      renderCommentList(snapshot.docs.map(doc => doc.data()));
                  }, err => { loadCommentsFallback(); });
            } else {
                loadCommentsFallback();
            }
        }

        function loadCommentsFallback() {
            const saved = localStorage.getItem('comments_' + currentPostId);
            let comments = saved ? JSON.parse(saved) : [];
            renderCommentList(comments);
        }

        function renderCommentList(comments) {
            const listEl = document.getElementById('commentList');
            listEl.innerHTML = '';
            if (comments.length === 0) {
                listEl.innerHTML = '<p class="text-center text-gray-400 py-4 text-xs">아직 댓글이 없습니다. 첫 댓글을 남겨보세요!</p>';
                return;
            }
            comments.forEach(c => {
                const div = document.createElement('div');
                div.className = "bg-gray-50 border border-gray-100 p-3 rounded-lg text-xs";
                div.innerHTML = `
                    <div class="flex justify-between text-gray-400 mb-0.5">
                        <span class="font-bold text-gray-700">${c.author}</span>
                        <span>${c.time}</span>
                    </div>
                    <p class="text-gray-800 whitespace-pre-wrap">${c.text}</p>
                `;
                listEl.appendChild(div);
            });
            listEl.scrollTop = listEl.scrollHeight;
        }

        function writeComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            const newComment = {
                author: myNickname,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            if (db && currentPostId.length > 10) {
                db.collection('rooms').doc(currentRoom).collection('posts').doc(currentPostId).collection('comments').add(newComment)
                  .then(() => { input.value = ''; });
            } else {
                const saved = localStorage.getItem('comments_' + currentPostId);
                let comments = saved ? JSON.parse(saved) : [];
                comments.push({ ...newComment, timestamp: Date.now() });
                localStorage.setItem('comments_' + currentPostId, JSON.stringify(comments));
                input.value = '';
                loadCommentsFallback();
            }
        }
    </script>
</body>
</html>
