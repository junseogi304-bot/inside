<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인사이드 톡 - 실시간 커뮤니티 포털</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Pretendard', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 힘겨루기 밀림 및 진동(바운스) 애니메이션 */
        @keyframes vs-push-wobble {
            0% { transform: scale(1) translateX(-50%); }
            30% { transform: scale(1.25) translateX(-50%) rotate(-8deg); }
            60% { transform: scale(0.95) translateX(-50%) rotate(6deg); }
            85% { transform: scale(1.08) translateX(-50%) rotate(-3deg); }
            100% { transform: scale(1) translateX(-50%) rotate(0deg); }
        }
        .animate-vs-move { animation: vs-push-wobble 0.6s cubic-bezier(0.25, 1, 0.5, 1); }

        /* 네온 불빛 깜빡임 (은은하게 밝기만 낮춤) */
        @keyframes neon-glow {
            0%, 100% { filter: drop-shadow(0 0 1px rgba(99, 102, 241, 0.2)); opacity: 0.9; }
            50% { filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.5)) drop-shadow(0 0 9px rgba(59, 130, 246, 0.35)); opacity: 1; }
        }
        .neon-bar-effect { animation: neon-glow 2.8s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-sm z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <button onclick="goHome()" class="flex items-center space-x-2 text-left group">
                <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow-md shadow-blue-100 group-hover:bg-blue-700 transition">💬</div>
                <div>
                    <h1 class="font-black text-slate-900 text-lg leading-none tracking-tight">인사이드 톡</h1>
                    <span class="text-[11px] text-blue-600 font-semibold">실시간 클라우드 커뮤니티</span>
                </div>
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <div id="connection-status" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-amber-50 text-amber-600 border border-amber-200">
                <span class="w-1.5 h-1.5 mr-1.5 bg-amber-500 rounded-full animate-pulse"></span> 연결 중...
            </div>
            <div id="nickname-badge" class="bg-slate-100 text-slate-700 font-bold text-xs px-3 py-1.5 rounded-xl border border-slate-200 truncate max-w-[120px]">
                익명
            </div>
            <button onclick="shareLink()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold px-3 py-1.5 rounded-lg transition flex items-center space-x-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                <span class="hidden sm:inline">링크 복사</span>
            </button>
        </div>
    </header>

    <!-- Main View Area -->
    <main class="flex-grow overflow-y-auto max-w-5xl w-full mx-auto p-4 flex flex-col space-y-6">
        
        <!-- VIEW 1: HOME / GALLERY LIST -->
        <div id="view-home" class="space-y-6">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 text-white shadow-lg relative overflow-hidden">
                <div class="relative z-10 space-y-2">
                    <span class="bg-white/20 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg uppercase tracking-wider">LIVE CLOUD</span>
                    <h2 class="text-xl font-bold leading-snug">
                        그동안 나 혼자만 알고 있던 이야기들<br>인사이드 톡에서 풀고 가세요!
                    </h2>
                    <p class="text-xs text-blue-100 leading-relaxed max-w-xl">원하는 갤러리(방)에 입장하여 실시간으로 올라오는 다른 사람들의 글과 댓글을 확인하고 소통해 보세요.</p>
                </div>
                <div class="absolute -right-4 -bottom-6 text-7xl opacity-20 font-black">⚡</div>
            </div>

            <!-- 미니 찬반 토론 위젯 -->
            <div id="mini-vs-container" class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 rounded-2xl border border-indigo-100 shadow-sm p-5 space-y-4">
                <!-- 동적 렌더링 영역 -->
            </div>

            <div>
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-bold text-slate-800 text-base flex items-center space-x-1.5">
                        <span>📂</span><span>실시간 갤러리 목록</span>
                    </h3>
                    <span class="text-xs text-slate-400">클릭해서 실시간 방으로 입장하세요</span>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="gallery-grid"></div>
            </div>

            <!-- 실시간 HOT 글 순위표 -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden mt-6">
                <div class="bg-slate-50 border-b border-slate-200 px-4 py-3 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="text-rose-500 font-black">🔥</span>
                        <h3 class="font-bold text-slate-900 text-sm">실시간 HOT 베스트</h3>
                    </div>
                    <span class="text-[11px] text-slate-400">전체 갤러리 실시간 인기글 TOP 5</span>
                </div>
                <div id="hot-posts-container" class="divide-y divide-slate-100">
                    <div class="p-6 text-center text-xs text-slate-400">실시간 인기글 집계 중...</div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: BOARD / ROOM VIEW -->
        <div id="view-room" class="hidden flex-col flex-grow space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between shrink-0">
                <div class="flex items-center space-x-3">
                    <button onclick="goHome()" class="w-9 h-9 bg-slate-100 hover:bg-slate-200 rounded-xl flex items-center justify-center text-slate-600 transition font-bold">←</button>
                    <div>
                        <div class="flex items-center space-x-2">
                            <span id="current-room-icon" class="text-lg"></span>
                            <h2 id="current-room-title" class="font-bold text-slate-900 text-base"></h2>
                        </div>
                        <p id="current-room-desc" class="text-xs text-slate-400"></p>
                    </div>
                </div>
                <button onclick="openWriteModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl shadow-sm transition flex items-center space-x-1">
                    <span>✏️</span><span>글쓰기</span>
                </button>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm flex-grow overflow-hidden flex flex-col">
                <div class="p-3 bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 flex justify-between">
                    <span>실시간 제목 및 내용</span>
                    <span>작성자 / 조회수 / 좋아요 / 시간</span>
                </div>
                <div id="posts-container" class="divide-y divide-slate-100 overflow-y-auto flex-grow"></div>
            </div>
        </div>

        <!-- VIEW 3: POST DETAIL & COMMENTS VIEW -->
        <div id="view-post" class="hidden flex-col flex-grow space-y-4">
            <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-sm flex items-center justify-between shrink-0">
                <button onclick="backToRoom()" class="flex items-center space-x-1.5 text-xs font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 px-3 py-2 rounded-xl transition">
                    <span>←</span><span>목록으로</span>
                </button>
                <span id="detail-room-badge" class="text-xs font-semibold px-2.5 py-1 bg-blue-50 text-blue-600 rounded-lg"></span>
            </div>

            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
                <div class="border-b border-slate-100 pb-4">
                    <h2 id="detail-title" class="text-lg font-bold text-slate-900 mb-2"></h2>
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span id="detail-author" class="font-semibold text-slate-600"></span>
                        <div class="flex items-center space-x-3">
                            <span id="detail-stats">조회 0 · 좋아요 0</span>
                            <span id="detail-time"></span>
                        </div>
                    </div>
                </div>
                
                <!-- VS 토론 상세 전용 투표 영역 -->
                <div id="detail-vs-area" class="hidden my-4 p-4 bg-indigo-50/60 rounded-2xl border border-indigo-100 space-y-3">
                    <!-- 동적 렌더링 -->
                </div>

                <!-- 이미지 첨부 표시 영역 -->
                <div id="detail-image-box" class="hidden my-3">
                    <img id="detail-image" src="" alt="첨부 이미지" class="max-h-80 rounded-xl border border-slate-200 object-contain mx-auto">
                </div>

                <div id="detail-content" class="text-sm text-slate-700 whitespace-pre-wrap leading-relaxed min-h-[80px]"></div>
                
                <!-- Like Button Area -->
                <div class="flex justify-center pt-2">
                    <button onclick="handleLike()" id="like-btn" class="flex items-center space-x-2 border px-5 py-2.5 rounded-2xl font-bold text-xs transition shadow-sm bg-rose-50 hover:bg-rose-100 text-rose-600 border-rose-200">
                        <span id="like-icon">❤️</span> <span>좋아요</span>
                        <span id="detail-like-count" class="bg-white px-2 py-0.5 rounded-full text-rose-600 shadow-2xs">0</span>
                    </button>
                </div>
            </div>

            <!-- Comments Section -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4">
                <h3 class="font-bold text-slate-800 text-sm flex items-center space-x-1">
                    <span>💬</span><span>실시간 토론/칭찬 댓글 <span id="comment-count" class="text-blue-600">0</span></span>
                </h3>

                <div id="comments-list" class="space-y-3 max-h-60 overflow-y-auto pr-1"></div>

                <form onsubmit="submitComment(event)" class="flex space-x-2 pt-2 border-t border-slate-100">
                    <input 
                        type="text" 
                        id="comment-input" 
                        placeholder="칭찬이나 생각을 실시간 댓글로 남겨보세요..." 
                        autocomplete="off"
                        required
                        class="flex-grow bg-slate-50 border border-slate-200 text-xs rounded-xl px-4 py-2.5 focus:outline-none focus:border-blue-500 focus:bg-white transition"
                    >
                    <button type="submit" class="bg-slate-900 hover:bg-blue-600 text-white font-medium px-4 py-2.5 rounded-xl text-xs transition shrink-0">
                        등록
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- Write Post Modal -->
    <div id="write-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl border border-slate-100 space-y-4">
            <div class="flex items-center justify-between">
                <h3 id="modal-heading" class="text-base font-bold text-slate-900">새 글 작성하기</h3>
                <button onclick="closeWriteModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg">&times;</button>
            </div>
            
            <form onsubmit="submitPost(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">제목</label>
                    <input type="text" id="post-title-input" required placeholder="제목을 입력하세요" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-blue-500">
                </div>
                
                <!-- 찬반 토론 옵션 체크박스 -->
                <div id="vs-option-container" class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2">
                    <label class="flex items-center space-x-2 cursor-pointer select-none">
                        <input type="checkbox" id="is-vs-checkbox" onchange="toggleVsInputs()" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                        <span class="text-xs font-bold text-indigo-900">⚖️ 이 글을 '찬반 토론(VS)'으로 등록하기</span>
                    </label>
                    <div id="vs-inputs-box" class="hidden grid grid-cols-2 gap-2 pt-1">
                        <input type="text" id="vs-opt1-input" placeholder="찬성 항목 (예: 부먹)" class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                        <input type="text" id="vs-opt2-input" placeholder="반대 항목 (예: 찍먹)" class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <!-- 사진 첨부 입력 -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">사진 첨부 (이미지 파일 업로드)</label>
                    <div class="flex space-x-2">
                        <input type="file" id="post-image-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                    </div>
                    <input type="hidden" id="post-image-url-input">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-500 mb-1">내용</label>
                    <textarea id="post-content-input" rows="4" required placeholder="자유롭게 이야기를 남겨주세요..." class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-blue-500 resize-none"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeWriteModal()" class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">취소</button>
                    <button type="submit" class="px-5 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-sm transition">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Imports & Direct Firestore Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, increment, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        let db;
        let currentRoomId = null;
        let currentPostId = null;
        let postsUnsubscribe = null;
        let commentsUnsubscribe = null;
        let postDetailUnsubscribe = null;
        let hotPostsUnsubscribes = [];
        let allVsPosts = [];

        const appId = 'insideonside';
        const firebaseConfig = {
            apiKey: "AIzaSyAYYX1ONHIIKvp35VOn-emjQRSk2WYoirM",
            authDomain: "insideonside.firebaseapp.com",
            projectId: "insideonside",
            storageBucket: "insideonside.firebasestorage.app",
            messagingSenderId: "821707087552",
            appId: "1:821707087552:web:0850d20fee543ac94ad725",
            measurementId: "G-675070ZSZL"
        };

        const galleries = [
            { id: 'romance', title: '연애고민 갤러리', desc: '썸, 짝사랑, 연애 썰과 고민', icon: '💌', color: 'bg-pink-50 text-pink-600 border-pink-100 hover:border-pink-300' },
            { id: 'life', title: '인생고민 갤러리', desc: '진로, 취업, 인간관계 상담', icon: '🌱', color: 'bg-emerald-50 text-emerald-600 border-emerald-100 hover:border-emerald-300' },
            { id: 'humor', title: '유머/썰 갤러리', desc: '웃긴 이야기, 일상 에피소드', icon: '😂', color: 'bg-amber-50 text-amber-600 border-amber-100 hover:border-amber-300' },
            { id: 'tech', title: '디지털/IT 갤러리', desc: '전자기기, 앱, 테크 정보', icon: '💻', color: 'bg-blue-50 text-blue-600 border-blue-100 hover:border-blue-300' },
            { id: 'praise', title: '칭찬해주세요 갤러리', desc: '자랑하고 칭찬받는 따뜻한 공간', icon: '🏆', color: 'bg-purple-50 text-purple-600 border-purple-100 hover:border-purple-300' }
        ];

        function generateNickname() {
            const animals = ["다람쥐", "토끼", "쿼카", "판다", "펭귄", "햄스터", "너구리", "여우", "백구", "기린"];
            const adjectives = ["졸린", "행복한", "배고픈", "신난", "멍때리는", "노래하는", "춤추는", "고민하는"];
            return `${adjectives[Math.floor(Math.random() * adjectives.length)]} ${animals[Math.floor(Math.random() * animals.length)]} #${Math.floor(Math.random() * 900) + 100}`;
        }

        function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);

                const statusEl = document.getElementById('connection-status');
                statusEl.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-600 border border-emerald-200";
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full"></span> 톡 활성화됨';

                initHotPosts();
                initVsWidget();
            } catch (err) {
                console.error("Firebase connection error:", err);
                const statusEl = document.getElementById('connection-status');
                statusEl.className = "inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-rose-50 text-rose-600 border border-rose-200";
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 mr-1.5 bg-rose-500 rounded-full"></span> 연결 오류';
            }
        }

        function initApp() {
            let myNickname = localStorage.getItem('dc_nickname');
            if (!myNickname) {
                myNickname = generateNickname();
                localStorage.setItem('dc_nickname', myNickname);
            }
            document.getElementById('nickname-badge').innerText = myNickname;
            renderGalleries();
            initFirebase();
        }

        function renderGalleries() {
            const grid = document.getElementById('gallery-grid');
            if (!grid) return;
            grid.innerHTML = galleries.map(g => `
                <button onclick="window.enterGallery('${g.id}')" class="p-5 rounded-2xl border-2 ${g.color} transition flex flex-col items-start text-left space-y-3 shadow-sm group">
                    <span class="text-3xl bg-white p-2.5 rounded-xl shadow-xs">${g.icon}</span>
                    <div>
                        <h4 class="font-bold text-slate-900 text-sm group-hover:text-blue-600">${g.title}</h4>
                        <p class="text-[11px] text-slate-500 mt-0.5">${g.desc}</p>
                    </div>
                </button>
            `).join('');
        }

        function initHotPosts() {
            hotPostsUnsubscribes.forEach(unsub => unsub());
            hotPostsUnsubscribes = [];

            const allPostsMap = new Map();

            galleries.forEach(gallery => {
                const postsCol = collection(db, 'artifacts', appId, 'public', 'data', `room_${gallery.id}_posts`);
                const unsub = onSnapshot(postsCol, (snapshot) => {
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        allPostsMap.set(docSnap.id, {
                            id: docSnap.id,
                            roomId: gallery.id,
                            roomTitle: gallery.title,
                            title: data.title || '',
                            views: data.views || 0,
                            likes: data.likes || 0,
                            createdAt: data.createdAt || 0
                        });
                    });
                    renderHotPosts(Array.from(allPostsMap.values()));
                }, (err) => {
                    console.error("Hot posts error:", err);
                });
                hotPostsUnsubscribes.push(unsub);
            });
        }

        function renderHotPosts(allPosts) {
            const container = document.getElementById('hot-posts-container');
            if (!container) return;

            allPosts.sort((a, b) => {
                const scoreA = (a.likes * 3) + a.views;
                const scoreB = (b.likes * 3) + b.views;
                if (scoreB !== scoreA) return scoreB - scoreA;
                return b.createdAt - a.createdAt;
            });

            const topPosts = allPosts.slice(0, 5);

            if (topPosts.length === 0 || topPosts.every(p => p.views === 0 && p.likes === 0)) {
                container.innerHTML = `<div class="p-6 text-center text-xs text-slate-400">아직 반응이 집계된 인기글이 없습니다. 첫 글을 작성해 보세요!</div>`;
                return;
            }

            container.innerHTML = topPosts.map((p, index) => {
                const rankClass = index === 0 ? 'bg-orange-500 text-white' : index === 1 ? 'bg-amber-500 text-white' : index === 2 ? 'bg-amber-600 text-white' : 'bg-slate-200 text-slate-700';

        function initVsWidget() {
            const allVsMap = new Map();

            galleries.forEach(gallery => {
                const postsCol = collection(db, 'artifacts', appId, 'public', 'data', `room_${gallery.id}_posts`);
                onSnapshot(postsCol, (snapshot) => {
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (data.isVs) {
                            allVsMap.set(docSnap.id, {
                                id: docSnap.id,
                                roomId: gallery.id,
                                roomTitle: gallery.title,
                                title: data.title || '',
                                opt1: data.vsOpt1 || '찬성',
                                opt2: data.vsOpt2 || '반대',
                                count1: data.vsCount1 || 0,
                                count2: data.vsCount2 || 0,
                                createdAt: data.createdAt || 0
                            });
                        }
                    });
                    allVsPosts = Array.from(allVsMap.values());
                    renderVsWidget();
                });
            });
        }

        function renderVsWidget() {
            const container = document.getElementById('mini-vs-container');
            if (!container) return;

            let target;
            if (allVsPosts.length > 0) {
                allVsPosts.sort((a, b) => (b.count1 + b.count2) - (a.count1 + a.count2) || b.createdAt - a.createdAt);
                target = allVsPosts[0];
            } else {
                target = {
                    id: 'default_vs',
                    isDefault: true,
                    title: "평생 탕수육 [부먹 vs 찍먹] 당신의 선택은?",
                    roomTitle: "유머/썰 갤러리",
                    opt1: "부먹 (소스 부어 먹기)",
                    opt2: "찍먹 (소스 찍어 먹기)",
                    count1: 142,
                    count2: 218
                };
            }

            const total = target.count1 + target.count2;
            const p1 = total > 0 ? Math.round((target.count1 / total) * 100) : 50;
            const p2 = 100 - p1;

            const hasVoted = localStorage.getItem(`voted_${target.id}`) === 'true';

            const existingBadge = document.getElementById(`vs-badge-${target.id}`);
            if (existingBadge) {
                existingBadge.style.left = `${p1}%`;
                const bar1 = document.getElementById(`vs-bar1-${target.id}`);
                const bar2 = document.getElementById(`vs-bar2-${target.id}`);
                if (bar1) bar1.style.width = `${p1}%`;
                if (bar2) bar2.style.width = `${p2}%`;

                const titleEl = document.getElementById(`vs-title-${target.id}`);
                if (titleEl) titleEl.innerText = target.title;
                const c1El = document.getElementById(`vs-c1-${target.id}`);
                if (c1El) c1El.innerText = `${target.count1}표 (${p1}%)`;
                const c2El = document.getElementById(`vs-c2-${target.id}`);
                if (c2El) c2El.innerText = `${target.count2}표 (${p2}%)`;
                return;
            }

            const clickAction = target.isDefault ? 
                `alert("기본 예시 토론입니다! 직접 우측 상단 '글쓰기' 버튼을 눌러 나만의 찬반 토론을 열어보세요!");` : 
                `window.openHotPost('${target.roomId}', '${target.id}')`;

            container.innerHTML = `
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="text-indigo-600 font-black">⚖️</span>
                        <h3 class="font-bold text-slate-900 text-sm">실시간 찬반 토론</h3>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="text-[11px] text-slate-500 font-medium hidden sm:inline cursor-pointer hover:text-indigo-600 transition" onclick="${clickAction}">👆 클릭하여 인사이드 사람들의 반응도 확인해보세요</span>
                        <span class="text-[10px] font-semibold text-indigo-600 bg-indigo-100 px-2 py-0.5 rounded-full">${target.roomTitle}</span>
                    </div>
                </div>
                <div class="space-y-3">
                    <h4 id="vs-title-${target.id}" class="font-bold text-slate-800 text-sm cursor-pointer hover:text-indigo-600 flex items-center justify-between transition" onclick="${clickAction}">
                        <span>${escapeHtml(target.title)}</span>
                        <span class="text-[11px] text-slate-400 font-normal">👆 반응 보기</span>
                    </h4>
                    
                    <div class="grid grid-cols-2 gap-4 items-center pt-1">
                        <button onclick="voteVs('${target.id}', 1, ${target.isDefault}, '${target.roomId}')" class="p-3 bg-white ${hasVoted ? 'opacity-70 cursor-not-allowed' : 'hover:bg-indigo-50'} border border-indigo-200 rounded-xl text-xs font-bold text-indigo-700 shadow-2xs transition flex flex-col items-center space-y-1">
                            <span>🔴 ${escapeHtml(target.opt1)}</span>
                            <span id="vs-c1-${target.id}" class="text-[10px] text-slate-400">${target.count1}표 (${p1}%)</span>
                        </button>

                        <button onclick="voteVs('${target.id}', 2, ${target.isDefault}, '${target.roomId}')" class="p-3 bg-white ${hasVoted ? 'opacity-70 cursor-not-allowed' : 'hover:bg-blue-50'} border border-blue-200 rounded-xl text-xs font-bold text-blue-700 shadow-2xs transition flex flex-col items-center space-y-1">

                    <div class="relative pt-3 pb-1">
                        <div id="vs-badge-${target.id}" class="absolute top-0 transform -translate-x-1/2 w-8 h-8 rounded-full bg-gradient-to-tr from-rose-500 to-indigo-600 text-white font-black text-xs flex items-center justify-center shadow-md border-2 border-white z-10 transition-all duration-700 ease-out" style="left: ${p1}%;">
                            VS
                        </div>
                        
                        <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden flex neon-bar-effect">
                            <div id="vs-bar1-${target.id}" class="bg-indigo-500 transition-all duration-700 ease-out" style="width: ${p1}%"></div>
                            <div id="vs-bar2-${target.id}" class="bg-blue-500 transition-all duration-700 ease-out" style="width: ${p2}%"></div>
                        </div>
                    </div>
                    ${hasVoted ? '<div class="text-[11px] text-center text-indigo-600 font-semibold pt-0.5">✅ 이미 투표를 완료한 토론입니다!</div>' : ''}
                </div>
            `;
        }

        window.voteVs = async function(postId, optNum, isDefault, roomId) {
            if (isDefault) {
                alert("기본 예시 토론입니다! 직접 우측 상단 '글쓰기' 버튼을 눌러 나만의 찬반 토론을 열어보세요!");
                return;
            }

            const voteKey = `voted_${postId}`;
            if (localStorage.getItem(voteKey) === 'true') {
                alert("이미 이 토론에 투표하셨습니다! 개인당 투표는 한 번만 가능합니다.");
                return;
            }

            if (!postId || !roomId) return;
            try {
                const vsBadge = document.getElementById(`vs-badge-${postId}`);
                if (vsBadge) {
                    vsBadge.classList.add('animate-vs-move');
                    setTimeout(() => vsBadge.classList.remove('animate-vs-move'), 600);
                }

                const postRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${roomId}_posts`, postId);
                await updateDoc(postRef, {
                    [optNum === 1 ? 'vsCount1' : 'vsCount2']: increment(1)
                });
                
                localStorage.setItem(voteKey, 'true');
            } catch (err) {
                console.error("VS vote error:", err);
            }
        }

            window.enterGallery(roomId);

                window.openPost(postId);
            }, 100);

            document.getElementById('current-room-title').innerText = info.title;
            document.getElementById('current-room-desc').innerText = info.desc;

            const vsContainer = document.getElementById('vs-option-container');
            if (roomId === 'praise') {
                vsContainer.classList.add('hidden');
            } else {
                vsContainer.classList.remove('hidden');

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-post').classList.add('hidden');
            document.getElementById('view-room').classList.remove('hidden');
            document.getElementById('view-room').classList.add('flex');

        function listenPosts(roomId) {
            const container = document.getElementById('posts-container');
            container.innerHTML = `<div class="p-12 text-center text-xs text-slate-400">실시간 게시글 불러오는 중...</div>`;

            if (postsUnsubscribe) postsUnsubscribe();

            const postsCol = collection(db, 'artifacts', appId, 'public', 'data', `room_${roomId}_posts`);
            
            postsUnsubscribe = onSnapshot(postsCol, (snapshot) => {
                const posts = [];
                snapshot.forEach(docSnap => {
                    posts.push({ id: docSnap.id, ...docSnap.data() });
                });
                posts.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                if (posts.length === 0) {
                    container.innerHTML = `<div class="p-12 text-center text-xs text-slate-400">작성된 게시글이 없습니다. 우측 상단 '글쓰기' 버튼을 눌러 첫 글을 작성해 보세요!</div>`;
                    return;
                }

                container.innerHTML = posts.map(p => `
                    <div onclick="window.openPost('${p.id}')" class="p-4 hover:bg-slate-50 cursor-pointer transition flex items-center justify-between border-b border-slate-50">
                        <div class="space-y-1 pr-4">
                            <div class="flex items-center space-x-1.5">
                                ${p.isVs ? '<span class="text-[10px] font-bold bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded">VS 토론</span>' : ''}
                                ${p.imageUrl ? '<span class="text-[10px] font-bold bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded">📸 사진</span>' : ''}
                                <h4 class="font-bold text-slate-800 text-sm hover:text-blue-600">${escapeHtml(p.title)}</h4>
                            </div>
                            <p class="text-xs text-slate-500 line-clamp-1">${escapeHtml(p.content)}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-xs font-medium text-slate-700">${escapeHtml(p.nickname)}</div>
                            <div class="text-[10px] text-slate-400 mt-0.5">조회 ${p.views || 0} · 좋아요 ${p.likes || 0} · ${formatTime(p.createdAt)}</div>
                        </div>
                    </div>
                `).join('');
            }, (error) => {
                console.error("Posts subscription error:", error);
                container.innerHTML = `<div class="p-12 text-center text-xs text-rose-500">데이터 로딩 실패. Firestore 규칙(Rules)을 확인해주세요.</div>`;

        window.openPost = async function(postId) {
            currentPostId = postId;
            document.getElementById('detail-room-badge').innerText = galleries.find(g => g.id === currentRoomId).title;

            document.getElementById('view-room').classList.remove('flex');
            document.getElementById('view-room').classList.add('hidden');
            document.getElementById('view-post').classList.remove('hidden');
            document.getElementById('view-post').classList.add('flex');

            try {
                const postRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${currentRoomId}_posts`, postId);
                await updateDoc(postRef, {
                    views: increment(1)
                });
            } catch (err) {
                console.error("Failed to increment views:", err);
            }

            if (postDetailUnsubscribe) postDetailUnsubscribe();
            const postRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${currentRoomId}_posts`, postId);
            postDetailUnsubscribe = onSnapshot(postRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('detail-title').innerText = data.title;
                    document.getElementById('detail-author').innerText = `작성자: ${data.nickname}`;
                    document.getElementById('detail-time').innerText = formatTime(data.createdAt);
                    document.getElementById('detail-content').innerText = data.content;
                    document.getElementById('detail-stats').innerText = `조회 ${data.views || 0} · 좋아요 ${data.likes || 0}`;
                    document.getElementById('detail-like-count').innerText = data.likes || 0;

                    updateLikeButtonUI();

                    const imageBox = document.getElementById('detail-image-box');
                    const detailImage = document.getElementById('detail-image');
                    if (data.imageUrl) {
                        detailImage.src = data.imageUrl;
                        imageBox.classList.remove('hidden');
                    } else {
                        imageBox.classList.add('hidden');
                    }

                    const vsArea = document.getElementById('detail-vs-area');
                    if (data.isVs) {
                        vsArea.classList.remove('hidden');
                        const c1 = data.vsCount1 || 0;
                        const c2 = data.vsCount2 || 0;
                        const total = c1 + c2;
                        const p1 = total > 0 ? Math.round((c1 / total) * 100) : 50;
                        const p2 = 100 - p1;

                        const hasVoted = localStorage.getItem(`voted_${postId}`) === 'true';

                        const detailBadge = document.getElementById(`vs-badge-${postId}`);
                        if (detailBadge) {
                            detailBadge.style.left = `${p1}%`;
                            const dBar1 = document.getElementById(`detail-bar1-${postId}`);
                            const dBar2 = document.getElementById(`detail-bar2-${postId}`);

                            if (dBar2) dBar2.style.width = `${p2}%`;
                            return;
                        }

                        vsArea.innerHTML = `
                            <div class="text-xs font-bold text-indigo-900 mb-1">⚖️ 실시간 찬반 투표 진행 중</div>
                            <div class="grid grid-cols-2 gap-4 items-center py-1">
                                <button onclick="voteVs('${postId}', 1, false, '${currentRoomId}')" class="p-3 bg-white ${hasVoted ? 'opacity-70 cursor-not-allowed' : 'hover:bg-indigo-100'} border border-indigo-200 rounded-xl text-xs font-bold text-indigo-700 shadow-2xs transition flex flex-col items-center space-y-1">
                                    <span>🔴 ${escapeHtml(data.vsOpt1)}</span>
                                    <span class="text-[10px] text-slate-500">${c1}표 (${p1}%)</span>
                                </button>
                                
                                <button onclick="voteVs('${postId}', 2, false, '${currentRoomId}')" class="p-3 bg-white ${hasVoted ? 'opacity-70 cursor-not-allowed' : 'hover:bg-blue-100'} border border-blue-200 rounded-xl text-xs font-bold text-blue-700 shadow-2xs transition flex flex-col items-center space-y-1">
                                    <span>🔵 ${escapeHtml(data.vsOpt2)}</span>
                                    <span class="text-[10px] text-slate-500">${c2}표 (${p2}%)</span>
                                </button>
                            </div>
                            <!-- 상세 페이지 내 힘겨루기 애니메이션 & 은은한 네온 불빛 바 -->
                            <div class="relative pt-3 pb-1">
                                <div id="vs-badge-${postId}" class="absolute top-0 transform -translate-x-1/2 w-8 h-8 rounded-full bg-gradient-to-tr from-rose-500 to-indigo-600 text-white font-black text-xs flex items-center justify-center shadow-md border-2 border-white z-10 transition-all duration-700 ease-out" style="left: ${p1}%;">
                                    VS
                                </div>
                                <div class="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden flex neon-bar-effect">
                                    <div id="detail-bar1-${postId}" class="bg-indigo-500 transition-all duration-700 ease-out" style="width: ${p1}%"></div>
                                    <div id="detail-bar2-${postId}" class="bg-blue-500 transition-all duration-700 ease-out" style="width: ${p2}%"></div>

                            ${hasVoted ? '<div class="text-[11px] text-center text-indigo-600 font-semibold pt-0.5">✅ 이미 투표를 완료한 토론입니다!</div>' : ''}

                        vsArea.classList.add('hidden');

        window.handleLike = async function() {
            if (!currentPostId || !currentRoomId) return;

            const likeKey = `liked_${currentPostId}`;
            const isLiked = localStorage.getItem(likeKey) === 'true';

            try {
                const postRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${currentRoomId}_posts`, currentPostId);
                
                if (isLiked) {
                    await updateDoc(postRef, {
                        likes: increment(-1)
                    });
                    localStorage.removeItem(likeKey);
                } else {
                    await updateDoc(postRef, {
                        likes: increment(1)
                    });
                    localStorage.setItem(likeKey, 'true');
                }

                updateLikeButtonUI();

                const likeBtn = document.getElementById('like-btn');
                likeBtn.classList.add('scale-110');
                setTimeout(() => likeBtn.classList.remove('scale-110'), 200);
            } catch (err) {
                console.error("Failed to toggle like:", err);
            }
        }

        function updateLikeButtonUI() {
            if (!currentPostId) return;
            const likeKey = `liked_${currentPostId}`;
            const isLiked = localStorage.getItem(likeKey) === 'true';
            const likeBtn = document.getElementById('like-btn');
            const likeIcon = document.getElementById('like-icon');

            if (isLiked) {
                likeBtn.className = "flex items-center space-x-2 border px-5 py-2.5 rounded-2xl font-bold text-xs transition shadow-sm bg-rose-500 hover:bg-rose-600 text-white border-rose-600 scale-100";
                likeIcon.innerText = "💖";
            } else {
                likeBtn.className = "flex items-center space-x-2 border px-5 py-2.5 rounded-2xl font-bold text-xs transition shadow-sm bg-rose-50 hover:bg-rose-100 text-rose-600 border-rose-200 scale-100";
                likeIcon.innerText = "❤️";
            }
        }

        function listenComments(postId) {
            const container = document.getElementById('comments-list');
            container.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">댓글 불러오는 중...</div>`;

            if (commentsUnsubscribe) commentsUnsubscribe();

            const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', `post_${postId}_comments`);

            commentsUnsubscribe = onSnapshot(commentsCol, (snapshot) => {
                const comments = [];
                snapshot.forEach(docSnap => {
                    comments.push({ id: docSnap.id, ...docSnap.data() });
                });
                comments.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

                document.getElementById('comment-count').innerText = comments.length;

                if (comments.length === 0) {
                    container.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">첫 번째 댓글을 남겨보세요!</div>`;
                    return;
                }

                container.innerHTML = comments.map(c => `
                    <div class="bg-slate-50 rounded-xl p-3 text-xs space-y-1">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-700">${escapeHtml(c.nickname)}</span>
                            <span class="text-[10px] text-slate-400">${formatTime(c.createdAt)}</span>
                        </div>
                        <p class="text-slate-600 leading-relaxed">${escapeHtml(c.text)}</p>
                    </div>
                `).join('');
            }, (error) => {
                console.error("Comments error:", error);
                container.innerHTML = `<div class="text-center text-xs text-rose-500 py-4">댓글 로드 중 오류 발생</div>`;
            });
        }

        window.submitComment = async function(event) {
            event.preventDefault();
            const input = document.getElementById('comment-input');
            const text = input.value.trim();
            if (!text || !currentPostId) return;

            const myNickname = localStorage.getItem('dc_nickname') || '익명';
            input.value = '';

            try {
                const commentsCol = collection(db, 'artifacts', appId, 'public', 'data', `post_${currentPostId}_comments`);
                await addDoc(commentsCol, {
                    text: text,
                    nickname: myNickname,
                    createdAt: Date.now()
                });
            } catch (err) {
                console.error("Failed to add comment:", err);
            }
        }

            const isChecked = document.getElementById('is-vs-checkbox').checked;
            const box = document.getElementById('vs-inputs-box');
            if (isChecked) {
                box.classList.remove('hidden');
            } else {
                box.classList.add('hidden');
            }
        }

        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('post-image-url-input').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        window.submitPost = async function(event) {
            event.preventDefault();
            const title = document.getElementById('post-title-input').value.trim();
            const content = document.getElementById('post-content-input').value.trim();
            const imageUrl = document.getElementById('post-image-url-input').value.trim();
            const isVs = currentRoomId !== 'praise' && document.getElementById('is-vs-checkbox').checked;
            const vsOpt1 = document.getElementById('vs-opt1-input').value.trim();
            const vsOpt2 = document.getElementById('vs-opt2-input').value.trim();

            if (!title || !content || !currentRoomId) return;

            const myNickname = localStorage.getItem('dc_nickname') || '익명';
            closeWriteModal();

            try {
                const postsCol = collection(db, 'artifacts', appId, 'public', 'data', `room_${currentRoomId}_posts`);
                const postData = {
                    title: title,
                    content: content,
                    imageUrl: imageUrl,
                    nickname: myNickname,
                    views: 0,
                    likes: 0,
                    createdAt: Date.now(),
                    isVs: isVs
                };

                if (isVs) {
                    postData.vsOpt1 = vsOpt1 || '찬성';
                    postData.vsOpt2 = vsOpt2 || '반대';
                    postData.vsCount1 = 0;
                    postData.vsCount2 = 0;
                }

                await addDoc(postsCol, postData);
            } catch (err) {
                console.error("Failed to submit post:", err);
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function formatTime(timestamp) {
            if (!timestamp) return '방금 전';
            const date = new Date(Number(timestamp));
            const now = new Date();
            const diff = (now - date) / 1000;
            if (diff < 60) return '방금 전';
            if (diff < 3600) return `${Math.floor(diff / 60)}분 전`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}시간 전`;
            return `${date.getMonth() + 1}/${date.getDate()}`;
        }

        window.shareLink = function() {
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = window.location.href;
            document.execCommand('copy');
            document.body.removeChild(dummy);
            
            const toast = document.createElement('div');
            toast.className = "fixed bottom-16 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2 rounded-xl shadow-lg z-50 animate-bounce";
            toast.innerText = "클립보드에 링크가 복사되었습니다! 친구에게 공유해보세요.";
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        window.onload = initApp;
    </script>
</body>
</html>
